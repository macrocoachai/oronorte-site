<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=1080,H=1920,CX=540,CY=1000;
const L={en:{q:["What's inside","an AI company?"],you:"YOU",fd:"signs off",led:"Every action on the record.",tag:["8 AI agents.","1 founder."],end1:"No promises.",end2:"Measured results.",paper:"paper only",
 a:[["POLARIS","CEO"],["ATLAS","Strategist"],["VEGA","Builder"],["ORION","Closer"],["ALTAIR","Keeper"],["NOVA","Trading desk"],["LYRA","Brand"],["SIRIUS","Scout"]]},
 es:{q:["¿Qué hay dentro de","una empresa de IA?"],you:"TÚ",fd:"aprueba",led:"Cada acción queda registrada.",tag:["8 agentes de IA.","1 fundador."],end1:"Sin promesas.",end2:"Resultados medidos.",paper:"solo simulado",
 a:[["POLARIS","CEO"],["ATLAS","Estratega"],["VEGA","Constructor"],["ORION","Cerrador"],["ALTAIR","Guardián"],["NOVA","Trading"],["LYRA","Marca"],["SIRIUS","Explorador"]]}};
let lang='en';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>cl((t-a)/(b-a)), eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=[...Array(140)].map(()=>[rnd()*W,rnd()*H,rnd()*1.6+.3,rnd()*6.28]);
function goldGrad(x0,y0,x1,y1){const g=X.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#9A6E22');g.addColorStop(.45,'#FFF3C4');g.addColorStop(1,'#D9AE4E');return g}
function star(x,y,r,rot,alpha,split=0){X.save();X.translate(x,y);X.rotate(rot);X.globalAlpha=alpha;
 for(let k=0;k<4;k++){X.save();X.rotate(k*Math.PI/2);X.translate(0,-split);X.beginPath();X.moveTo(0,-r);X.quadraticCurveTo(r*.08,-r*.08,r*.24,0);X.lineTo(-r*.24,0);X.quadraticCurveTo(-r*.08,-r*.08,0,-r);X.closePath();X.fillStyle=goldGrad(-r,-r,r,r);X.fill();X.restore()}
 X.restore()}
function text(s,x,y,size,weight,color,align='center',alpha=1,ls=0){X.save();X.globalAlpha=alpha;X.font=`${weight} ${size}px Inter, system-ui, sans-serif`;X.textAlign=align;X.textBaseline='middle';if(ls)X.letterSpacing=ls+'px';X.fillStyle=color;X.fillText(s,x,y);X.restore()}
function render(t){const T=L[lang];
 // background
 const bg=X.createRadialGradient(CX,CY,50,CX,CY,1300);bg.addColorStop(0,'#1d1608');bg.addColorStop(.55,'#070605');bg.addColorStop(1,'#000');X.fillStyle=bg;X.fillRect(0,0,W,H);
 for(const [sx,sy,sr,ph] of stars){X.globalAlpha=.25+.25*Math.sin(t*1.3+ph);X.fillStyle='#e8d9b0';X.beginPath();X.arc(sx,(sy+t*6)%H,sr,0,6.28);X.fill()}X.globalAlpha=1;
 const zoom=1+0.06*seg(t,3,13); X.save();X.translate(CX,CY);X.scale(zoom,zoom);X.translate(-CX,-CY);
 // phase 1: star appears then opens
 const appear=eo(seg(t,0,1.2)), open=eio(seg(t,1.8,3.2));
 if(t<3.4){const r=170*appear*(1-0.3*open);const gl=X.createRadialGradient(CX,CY,0,CX,CY,320);gl.addColorStop(0,`rgba(255,220,140,${.35*appear*(1-open)})`);gl.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gl;X.fillRect(0,CY-340,W,680);
  star(CX,CY,r,t*.35,appear*(1-open),open*260)}
 // orbit + nodes
 const R=345, rot=-Math.PI/2+0.08*Math.sin(t*.4);
 const core=eo(seg(t,2.6,3.6));
 if(core>0){X.save();X.globalAlpha=core;X.beginPath();X.arc(CX,CY,92,0,6.28);X.fillStyle='rgba(217,174,78,.13)';X.fill();X.lineWidth=4;X.strokeStyle=goldGrad(CX-92,CY-92,CX+92,CY+92);X.stroke();X.restore();
  text(T.you,CX,CY-16,50,900,'#FFF3C4','center',core);text(T.fd,CX,CY+30,21,600,'#D9AE4E','center',seg(t,3.2,4))}
 // orbit ring
 const ring=eo(seg(t,3,4.2));if(ring>0){X.save();X.globalAlpha=.35*ring;X.setLineDash([4,10]);X.strokeStyle='#D9AE4E';X.lineWidth=2;X.beginPath();X.arc(CX,CY,R,-Math.PI/2,-Math.PI/2+6.283*ring);X.stroke();X.restore()}
 const pulse=seg(t,10.2,11.6);
 T.a.forEach(([n,role],i)=>{const st=3.6+i*0.72, p=eo(seg(t,st,st+.6)); if(p<=0)return;
  const ang=rot+i*Math.PI/4, nx=CX+Math.cos(ang)*R*p, ny=CY+Math.sin(ang)*R*p;
  // link line
  X.save();X.globalAlpha=.8*p;X.strokeStyle=goldGrad(CX,CY,nx,ny);X.lineWidth=2.5;if(n==='NOVA')X.setLineDash([10,10]);X.beginPath();X.moveTo(CX+Math.cos(ang)*96,CY+Math.sin(ang)*96);X.lineTo(nx-Math.cos(ang)*58,ny-Math.sin(ang)*58);X.stroke();X.restore();
  const pz=1+.18*Math.max(0,Math.sin((pulse*8-i*.9)*Math.PI))*(pulse>0&&pulse<1?1:0);
  X.save();X.globalAlpha=p;X.beginPath();X.arc(nx,ny,56*pz,0,6.28);X.fillStyle='#0d0a05';X.fill();X.lineWidth=3;X.strokeStyle=i==0?'#FFF3C4':'#D9AE4E';X.stroke();
  star(nx,ny,30*pz,0,p);X.restore();
  const lx=nx+Math.cos(ang)*0, ly=ny+(Math.sin(ang)>0.3?92:-92);
  text(n,nx,ly-(Math.sin(ang)>0.3?-0:16)+(Math.sin(ang)>0.3?-14:0),34,800,'#fff','center',p,3);
  text(n==='NOVA'?role+' · '+T.paper:role,nx,ly+(Math.sin(ang)>0.3?28:22),28,500,'#D9AE4E','center',p);
 });
 X.restore();
 // title
 const qa=seg(t,.4,1.2)*(1-seg(t,9.6,10.2));
 text(T.q[0],CX,300,64,800,'#fff','center',qa);text(T.q[1],CX,385,72,900,'#FFF3C4','center',qa);
 // ledger
 const lg=eo(seg(t,10.2,11.6)), la=1-seg(t,13.6,14.1);
 if(lg>0){const y=1580;X.save();X.globalAlpha=la;X.strokeStyle=goldGrad(140,y,940,y);X.lineWidth=4;X.beginPath();X.moveTo(140,y);X.lineTo(140+800*lg,y);X.stroke();
  for(let k=0;k<=16;k++){const x=140+k*50;if(x>140+800*lg)break;X.beginPath();X.moveTo(x,y-10);X.lineTo(x,y+10);X.lineWidth=2;X.stroke()}X.restore();
  text(T.led,CX,1660,44,700,'#fff','center',seg(t,10.8,11.5)*la)}
 const tg=seg(t,10.4,11)*(1-seg(t,13.6,14.1));text(T.tag[0],CX,300,70,900,'#fff','center',tg);text(T.tag[1],CX,390,70,900,'#FFF3C4','center',tg);
 // end card
 const e=eo(seg(t,13.8,14.8));if(e>0){X.fillStyle=`rgba(0,0,0,${e*.92})`;X.fillRect(0,0,W,H);star(CX,820,120*e,t*.3,e);
  text(T.end1,CX,1060,62,800,'#fff','center',e);text(T.end2,CX,1140,62,900,'#FFF3C4','center',e);text('oronorte.com',CX,1290,46,700,'#D9AE4E','center',seg(t,14.4,15.2),6);text('✦ ORONORTE',CX,1700,28,700,'#e8d9b0','center',e,8)}
}
window.render=render;window.setLang=l=>{lang=l};
</script></body></html>
