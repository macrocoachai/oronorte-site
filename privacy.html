<h2>9. Seu conteúdo e seus dados</h2><p>Seu conteúdo e seus dados são seus. Você nos concede uma licença limitada para hospedá-los e processá-los apenas para prestar e proteger o Serviço. Não vendemos seus dados. A Política de Privacidade explica como tratamos dados pessoais.</p>

<h2>14. Indenização</h2><p>Você nos defenderá e indenizará por reclamações decorrentes do uso do Serviço em violação destes Termos ou da lei, ou do conteúdo e das ações que autorizar.</p>

<h2>16. Lei aplicável e disputas</h2><p>Estes Termos são regidos pelas leis do Estado da Califórnia. As disputas serão resolvidas nos tribunais estaduais ou federais do Condado de Los Angeles, Califórnia, salvo uso de tribunal de pequenas causas por qualquer das partes. Se você for consumidor, mantém os direitos irrenunciáveis da sua lei local.</p>

let lang = (()=>{try{return localStorage.getItem('ov-lang')}catch(e){return null}})() || (navigator.language||'en').slice(0,2);

let doc = (location.hash==='#privacy' || /privacy/.test(location.pathname)) ? 'privacy' : 'terms';
function render(){
  const u=UI[lang];
  document.documentElement.lang=lang;
  document.title='ORONORTE · '+(doc==='terms'?u.tt:u.pt);
  document.querySelector('[data-d="terms"]').textContent=u.terms;
  document.querySelector('[data-d="privacy"]').textContent=u.privacy;
  document.querySelectorAll('[data-d]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===doc));
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  document.getElementById('doc').innerHTML='<h1>'+(doc==='terms'?u.tt:u.pt)+'</h1><div class="meta">'+u.eff+' '+EFFECTIVE[lang]+(lang==='en'?'':' · '+u.pre)+'</div>'+DOCS[lang][doc];
}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{doc=b.dataset.d;try{history.replaceState(null,'','#'+doc)}catch(e){};render();scrollTo(0,0)});
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('ov-lang',lang)}catch(e){};render()});
addEventListener('hashchange',()=>{doc=location.hash==='#privacy'?'privacy':'terms';render()});
render();
</script>
