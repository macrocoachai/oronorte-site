name: Fetch public-domain footage
on:
  workflow_dispatch:
  push:
    paths: ['_footage/*.txt', '_footage/*.py', '.github/workflows/footage.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: fetch
        run: python3 _footage/fetch.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - run: |
          git config user.name "oronorte-bot"; git config user.email "bot@oronorte.com"
          git add media/footage && git commit -m "Footage: NASA public-domain clips" && git push || echo "nothing new"
